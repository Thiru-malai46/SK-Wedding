<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F4"/>
      <stop offset="50%" stop-color="#F8E2D4"/>
      <stop offset="100%" stop-color="#F3D4CA"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF5C3"/>
      <stop offset="100%" stop-color="#C6A15B"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Ornate Royal Arch Border -->
  <rect x="25" y="25" width="750" height="950" rx="375" ry="375" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <rect x="40" y="40" width="720" height="920" rx="360" ry="360" fill="none" stroke="#C6A15B" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Mandalas & Decorative Motif -->
  <g transform="translate(400, 240)">
    <circle r="130" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle r="100" fill="none" stroke="#B77C78" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle r="70" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Diya / Sacred Kalasam Emblem -->
    <path d="M-30,40 Q0,50 30,40 Q35,10 0,0 Q-35,10 -30,40 Z" fill="#C6A15B"/>
    <circle cx="0" cy="-15" r="14" fill="#D4AF37"/>
    <path d="M-8,-25 Q0,-50 8,-25 Z" fill="#B77C78"/>
  </g>

  <!-- Central Silhouette Graphic: Royal Indian Groom & Bride -->
  <g transform="translate(400, 520)">
    <!-- Groom Silhouette -->
    <path d="M-130,220 Q-110,60 -60,50 Q-50,-20 -80,-50 Q-80,-100 -50,-100 Q-20,-100 -20,-50 Q-50,-20 -40,50 Q10,60 30,220 Z" fill="#49352F" opacity="0.88"/>
    <!-- Traditional Turban / Peta Accent -->
    <path d="M-75,-90 Q-50,-120 -25,-90 Q-15,-70 -50,-70 Z" fill="url(#goldGrad)"/>

    <!-- Bride Silhouette with Traditional Pallu & Ornaments -->
    <path d="M-10,220 Q10,70 60,60 Q50,-10 20,-40 Q20,-90 50,-90 Q80,-90 80,-40 Q50,-10 60,60 Q110,70 130,220 Z" fill="#B77C78" opacity="0.88"/>
    <!-- Maang Tikka & Flowers -->
    <circle cx="50" cy="-65" r="6" fill="#D4AF37"/>
    <path d="M25,-40 Q50,-25 75,-40" stroke="url(#goldGrad)" stroke-width="3" fill="none"/>

    <!-- Auspicious Wedding Garland (Varmala) -->
    <path d="M-50,60 Q0,130 50,60" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M-40,80 Q0,150 40,80" fill="none" stroke="#FFF9F4" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Title & Instructions Text -->
  <text x="400" y="800" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="bold" fill="#49352F" letter-spacing="3">K SURIYA ♥ V KAVIYA</text>
  <text x="400" y="845" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="16" font-weight="600" fill="#C6A15B" letter-spacing="4">COUPLE PHOTOGRAPH PLACEHOLDER</text>
  <text x="400" y="880" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="13" fill="#6b534b">To use your real couple photo, replace this file at:</text>
  <text x="400" y="905" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#B77C78">assets/images/hero-placeholder.svg</text>
</svg>
