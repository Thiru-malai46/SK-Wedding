<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="fGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F4"/>
      <stop offset="100%" stop-color="#F8E2D4"/>
    </linearGradient>
    <linearGradient id="fgold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#C6A15B"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#fGrad1)"/>
  <rect x="15" y="15" width="570" height="420" rx="16" fill="none" stroke="url(#fgold1)" stroke-width="2"/>
  <rect x="25" y="25" width="550" height="400" rx="12" fill="none" stroke="#B77C78" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Namaste / Family Blessings Emblem -->
  <g transform="translate(300, 180)">
    <circle r="65" fill="#FFF9F4" stroke="url(#fgold1)" stroke-width="3"/>
    <!-- Hands in Prayer (Anjali Mudra) -->
    <path d="M-8,-25 C-12,-15 -18,10 -14,25 C-12,30 -6,30 -4,22 L-2,-5 L-2,-25 Z" fill="#C6A15B"/>
    <path d="M8,-25 C12,-15 18,10 14,25 C12,30 6,30 4,22 L2,-5 L2,-25 Z" fill="#B77C78"/>
    <!-- Halo of Divine Light -->
    <circle cx="0" cy="-32" r="6" fill="#D4AF37"/>
  </g>

  <text x="300" y="320" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="bold" fill="#49352F">FAMILY BLESSINGS</text>
  <text x="300" y="350" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#C6A15B" letter-spacing="2">PHOTO PLACEHOLDER</text>
  <text x="300" y="380" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#6b534b">assets/images/family/family-1.svg</text>
</svg>
