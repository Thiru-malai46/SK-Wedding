<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F4"/>
      <stop offset="100%" stop-color="#F8E2D4"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#C6A15B"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#cGrad2)"/>
  <rect x="15" y="15" width="570" height="420" rx="16" fill="none" stroke="url(#gold2)" stroke-width="2"/>
  <rect x="25" y="25" width="550" height="400" rx="12" fill="none" stroke="#B77C78" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Temple Gopuram / Auspicious Wedding Muhurtham Emblem -->
  <g transform="translate(300, 180)">
    <circle r="65" fill="#FFF9F4" stroke="url(#gold2)" stroke-width="3"/>
    <!-- Temple Gopuram Icon -->
    <path d="M-25,25 L-20,-10 L-12,-25 L0,-38 L12,-25 L20,-10 L25,25 Z" fill="none" stroke="#C6A15B" stroke-width="3"/>
    <line x1="-30" y1="25" x2="30" y2="25" stroke="#49352F" stroke-width="3"/>
    <circle cx="0" cy="-44" r="5" fill="#B77C78"/>
    <!-- Sacred Kalasam & Sun Rays -->
    <path d="M-12,5 L12,5" stroke="url(#gold2)" stroke-width="2"/>
    <path d="M-8,-10 L8,-10" stroke="url(#gold2)" stroke-width="2"/>
  </g>

  <text x="300" y="320" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="bold" fill="#49352F">OUR WEDDING DAY</text>
  <text x="300" y="350" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#C6A15B" letter-spacing="2">PHOTO PLACEHOLDER</text>
  <text x="300" y="380" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#6b534b">assets/images/couple/couple-2.svg</text>
</svg>
