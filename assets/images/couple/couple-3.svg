<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F4"/>
      <stop offset="100%" stop-color="#F8E2D4"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#C6A15B"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#cGrad3)"/>
  <rect x="15" y="15" width="570" height="420" rx="16" fill="none" stroke="url(#gold3)" stroke-width="2"/>
  <rect x="25" y="25" width="550" height="400" rx="12" fill="none" stroke="#B77C78" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Palace Celebration Arch & Clinking Glasses Motif -->
  <g transform="translate(300, 180)">
    <circle r="65" fill="#FFF9F4" stroke="url(#gold3)" stroke-width="3"/>
    <!-- Palace Archway -->
    <path d="M-30,30 L-30,0 Q-30,-30 0,-30 Q30,-30 30,0 L30,30" fill="none" stroke="#C6A15B" stroke-width="3"/>
    <!-- Chandelier / Sparkle Stars -->
    <circle cx="0" cy="-10" r="4" fill="#B77C78"/>
    <path d="M-15,-5 L-15,10 M15,-5 L15,10" stroke="url(#gold3)" stroke-width="2"/>
  </g>

  <text x="300" y="320" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="bold" fill="#49352F">RECEPTION CELEBRATION</text>
  <text x="300" y="350" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#C6A15B" letter-spacing="2">PHOTO PLACEHOLDER</text>
  <text x="300" y="380" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#6b534b">assets/images/couple/couple-3.svg</text>
</svg>
