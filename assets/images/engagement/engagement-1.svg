<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="eGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F4"/>
      <stop offset="100%" stop-color="#F8E2D4"/>
    </linearGradient>
    <linearGradient id="egold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#C6A15B"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#eGrad1)"/>
  <rect x="15" y="15" width="570" height="420" rx="16" fill="none" stroke="url(#egold1)" stroke-width="2"/>
  <rect x="25" y="25" width="550" height="400" rx="12" fill="none" stroke="#B77C78" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Sacred Rings & Thaali Motif -->
  <g transform="translate(300, 180)">
    <circle r="65" fill="#FFF9F4" stroke="url(#egold1)" stroke-width="3"/>
    <!-- Interlocking Wedding Rings -->
    <circle cx="-14" cy="0" r="22" fill="none" stroke="#C6A15B" stroke-width="4"/>
    <circle cx="14" cy="0" r="22" fill="none" stroke="#D4AF37" stroke-width="4"/>
    <!-- Sparkle Diamond -->
    <polygon points="14,-22 18,-30 14,-38 10,-30" fill="#B77C78"/>
  </g>

  <text x="300" y="320" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="bold" fill="#49352F">ENGAGEMENT RITUALS</text>
  <text x="300" y="350" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="13" font-weight="600" fill="#C6A15B" letter-spacing="2">PHOTO PLACEHOLDER</text>
  <text x="300" y="380" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#6b534b">assets/images/engagement/engagement-1.svg</text>
</svg>
